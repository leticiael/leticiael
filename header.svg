<svg width="100%" viewBox="0 0 680 200" xmlns="http://www.w3.org/2000/svg">
<rect width="680" height="200" fill="#0d1117"/>
<defs>
<style>
.cur{animation:blink 1.1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.nd{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.nd2{animation:pulse 3s ease-in-out infinite .8s}
.nd3{animation:pulse 3s ease-in-out infinite 1.6s}
.ln{stroke-dasharray:200;stroke-dashoffset:200;animation:draw 2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.orb{animation:spin 14s linear infinite;transform-origin:590px 68px}
@keyframes spin{to{transform:rotate(360deg)}}
.fade{animation:fi 1.2s ease forwards;opacity:0}
@keyframes fi{to{opacity:1}}
</style>
</defs>
<line x1="0" y1="0" x2="680" y2="0" stroke="#21262d" stroke-width="1.5"/>
<line x1="0" y1="200" x2="680" y2="200" stroke="#21262d" stroke-width="1.5"/>
<line x1="0" y1="40" x2="680" y2="40" stroke="#c9d1d9" stroke-width=".4" opacity=".05"/>
<line x1="0" y1="80" x2="680" y2="80" stroke="#c9d1d9" stroke-width=".4" opacity=".05"/>
<line x1="0" y1="120" x2="680" y2="120" stroke="#c9d1d9" stroke-width=".4" opacity=".05"/>
<line x1="0" y1="160" x2="680" y2="160" stroke="#c9d1d9" stroke-width=".4" opacity=".05"/>
<line x1="136" y1="0" x2="136" y2="200" stroke="#c9d1d9" stroke-width=".4" opacity=".05"/>
<line x1="272" y1="0" x2="272" y2="200" stroke="#c9d1d9" stroke-width=".4" opacity=".05"/>
<line x1="408" y1="0" x2="408" y2="200" stroke="#c9d1d9" stroke-width=".4" opacity=".05"/>
<line x1="544" y1="0" x2="544" y2="200" stroke="#c9d1d9" stroke-width=".4" opacity=".05"/>
<path d="M24 22 L24 42 M24 22 L44 22" stroke="#30363d" stroke-width="1.2" fill="none" stroke-linecap="round"/>
<path d="M656 178 L656 158 M656 178 L636 178" stroke="#30363d" stroke-width="1.2" fill="none" stroke-linecap="round"/>
<line class="ln" x1="530" y1="50"  x2="590" y2="88"  stroke="#21262d" stroke-width=".8" style="animation-delay:.3s"/>
<line class="ln" x1="590" y1="88"  x2="640" y2="55"  stroke="#21262d" stroke-width=".8" style="animation-delay:.6s"/>
<line class="ln" x1="640" y1="55"  x2="655" y2="130" stroke="#21262d" stroke-width=".8" style="animation-delay:.9s"/>
<line class="ln" x1="655" y1="130" x2="600" y2="155" stroke="#21262d" stroke-width=".8" style="animation-delay:1.2s"/>
<line class="ln" x1="600" y1="155" x2="555" y2="115" stroke="#21262d" stroke-width=".8" style="animation-delay:1.5s"/>
<line class="ln" x1="555" y1="115" x2="530" y2="50"  stroke="#21262d" stroke-width=".8" style="animation-delay:1.8s"/>
<line class="ln" x1="590" y1="88"  x2="555" y2="115" stroke="#161b22" stroke-width=".5" style="animation-delay:2.1s"/>
<circle class="nd"  cx="530" cy="50"  r="3" fill="#484f58"/>
<circle class="nd2" cx="590" cy="88"  r="5" fill="#8b949e"/>
<circle class="nd3" cx="640" cy="55"  r="3" fill="#484f58"/>
<circle class="nd"  cx="655" cy="130" r="4" fill="#6e7681"/>
<circle class="nd2" cx="600" cy="155" r="3" fill="#484f58"/>
<circle class="nd3" cx="555" cy="115" r="4" fill="#8b949e"/>
<g class="orb">
  <circle cx="590" cy="56" r="12" fill="none" stroke="#21262d" stroke-width=".8" stroke-dasharray="3 3"/>
  <circle cx="590" cy="44" r="2" fill="#30363d"/>
</g>
<g class="fade" style="animation-delay:.1s">
  <text x="48" y="82" font-family="monospace" font-size="11" fill="#484f58">~/leticiael $</text>
</g>
<g class="fade" style="animation-delay:.4s">
  <text x="48" y="126" font-family="monospace" font-size="42" font-weight="700" fill="#c9d1d9">leticia el.</text>
</g>
<rect class="cur" x="340" y="104" width="3" height="26" fill="#6e7681"/>
<g class="fade" style="animation-delay:.8s">
  <text x="50" y="154" font-family="monospace" font-size="12" fill="#484f58">software engineer  ·  builder of things  ·  always learning</text>
</g>
<line x1="48" y1="170" x2="500" y2="170" stroke="#21262d" stroke-width=".8"
  style="stroke-dasharray:500;stroke-dashoffset:500;animation:draw 1.2s ease 1s forwards"/>
<g class="fade" style="animation-delay:1.2s">
  <rect x="48" y="180" width="90" height="15" rx="2" fill="#161b22" stroke="#30363d" stroke-width=".6"/>
  <text x="93" y="191" font-family="monospace" font-size="9" fill="#6e7681" text-anchor="middle">open to work</text>
  <rect x="148" y="180" width="60" height="15" rx="2" fill="#161b22" stroke="#30363d" stroke-width=".6"/>
  <text x="178" y="191" font-family="monospace" font-size="9" fill="#6e7681" text-anchor="middle">she/her</text>
</g>
</svg>
