<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" fill="none" role="img" aria-label="github stats">
  <title>github stats</title>

  <style>
    .glass { fill: #ffffff; fill-opacity: .035 }
    .edge  { stroke: #ffffff; stroke-opacity: .10 }
    .sheen { stroke: url(#sheenD) }
    .orb   { fill: #ffffff; fill-opacity: .10 }
    .fg    { fill: #f0f6fc }
    .dim   { fill: #8b949e }
    .faint { fill: #6e7681 }
    .track { fill: #ffffff; fill-opacity: .08 }
    .bar   { fill: #f0f6fc }

    @media (prefers-color-scheme: light) {
      .glass { fill: #0d1117; fill-opacity: .025 }
      .edge  { stroke: #0d1117; stroke-opacity: .10 }
      .sheen { stroke: url(#sheenL) }
      .orb   { fill: #0d1117; fill-opacity: .07 }
      .fg    { fill: #0d1117 }
      .dim   { fill: #57606a }
      .faint { fill: #6e7781 }
      .track { fill: #0d1117; fill-opacity: .08 }
      .bar   { fill: #0d1117 }
    }

    @keyframes rise  { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes grow  { from { transform: scaleX(0) } to { transform: scaleX(1) } }

    .card { animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards }
    .dly  { animation-delay: .12s }
    .bar  { transform-box: fill-box; transform-origin: left center; animation: grow 1s cubic-bezier(.2,.8,.2,1) .3s forwards }

    @media (prefers-reduced-motion: reduce) {
      .card, .bar { animation: none }
    }

    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif }
  </style>

  <defs>
    <linearGradient id="sheenD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="cA"><rect x="0" y="0" width="660" height="220" rx="26"/></clipPath>
    <clipPath id="cB"><rect x="684" y="0" width="316" height="220" rx="26"/></clipPath>
  </defs>

  <g class="card">
    <g clip-path="url(#cA)">
      <rect x="0" y="0" width="660" height="220" rx="26" class="glass"/>
      <circle cx="60" cy="210" r="120" class="orb" filter="url(#soft)"/>
      <rect x="0" y="0" width="660" height="220" filter="url(#grain)" opacity=".045"/>
      <text x="44" y="46" class="mono faint" font-size="11" letter-spacing="2.5">GITHUB</text>
      <text x="44" y="132" class="sans fg" font-size="40" font-weight="700" letter-spacing="-2">532</text>
      <text x="44" y="160" class="mono faint" font-size="10" letter-spacing="1.6">COMMITS (1Y)</text>
      <text x="196" y="132" class="sans fg" font-size="40" font-weight="700" letter-spacing="-2">3</text>
      <text x="196" y="160" class="mono faint" font-size="10" letter-spacing="1.6">STARS</text>
      <text x="348" y="132" class="sans fg" font-size="40" font-weight="700" letter-spacing="-2">14</text>
      <text x="348" y="160" class="mono faint" font-size="10" letter-spacing="1.6">REPOS</text>
      <text x="500" y="132" class="sans fg" font-size="40" font-weight="700" letter-spacing="-2">59</text>
      <text x="500" y="160" class="mono faint" font-size="10" letter-spacing="1.6">FOLLOWERS</text>
    </g>
    <rect x=".5" y=".5" width="659" height="219" rx="26" class="edge" stroke-width="1"/>
    <path d="M26.5 .5 H633.5 A26 26 0 0 1 659.5 26.5" class="sheen" stroke-width="1" fill="none"/>
  </g>

  <g class="card dly">
    <g clip-path="url(#cB)">
      <rect x="684" y="0" width="316" height="220" rx="26" class="glass"/>
      <circle cx="1000" cy="0" r="100" class="orb" filter="url(#soft)"/>
      <rect x="684" y="0" width="316" height="220" filter="url(#grain)" opacity=".045"/>
      <text x="712" y="46" class="mono faint" font-size="11" letter-spacing="2.5">LANGUAGES</text>
      <text x="712" y="82" class="mono dim" font-size="11">Jupyter Notebook</text>
      <text x="976" y="82" class="mono faint" font-size="10" text-anchor="end">82.5%</text>
      <rect x="712" y="89" width="264" height="3" rx="1.5" class="track"/>
      <rect x="712" y="89" width="217.8" height="3" rx="1.5" class="bar" fill-opacity="0.95"/>
      <text x="712" y="111" class="mono dim" font-size="11">Python</text>
      <text x="976" y="111" class="mono faint" font-size="10" text-anchor="end">5.7%</text>
      <rect x="712" y="118" width="264" height="3" rx="1.5" class="track"/>
      <rect x="712" y="118" width="15.1" height="3" rx="1.5" class="bar" fill-opacity="0.74"/>
      <text x="712" y="140" class="mono dim" font-size="11">JavaScript</text>
      <text x="976" y="140" class="mono faint" font-size="10" text-anchor="end">4.1%</text>
      <rect x="712" y="147" width="264" height="3" rx="1.5" class="track"/>
      <rect x="712" y="147" width="10.8" height="3" rx="1.5" class="bar" fill-opacity="0.56"/>
      <text x="712" y="169" class="mono dim" font-size="11">Kotlin</text>
      <text x="976" y="169" class="mono faint" font-size="10" text-anchor="end">3.3%</text>
      <rect x="712" y="176" width="264" height="3" rx="1.5" class="track"/>
      <rect x="712" y="176" width="8.7" height="3" rx="1.5" class="bar" fill-opacity="0.4"/>
      <text x="712" y="198" class="mono dim" font-size="11">CSS</text>
      <text x="976" y="198" class="mono faint" font-size="10" text-anchor="end">1.9%</text>
      <rect x="712" y="205" width="264" height="3" rx="1.5" class="track"/>
      <rect x="712" y="205" width="5.0" height="3" rx="1.5" class="bar" fill-opacity="0.28"/>
    </g>
    <rect x="684.5" y=".5" width="315" height="219" rx="26" class="edge" stroke-width="1"/>
    <path d="M710.5 .5 H973.5 A26 26 0 0 1 999.5 26.5" class="sheen" stroke-width="1" fill="none"/>
  </g>
</svg>
