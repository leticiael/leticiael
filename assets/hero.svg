<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" fill="none" role="img" aria-label="leticiael">
  <title>leticiael</title>

  <style>
    .glass    { fill: #ffffff; fill-opacity: .035 }
    .edge     { stroke: #ffffff; stroke-opacity: .10 }
    .sheen    { stroke: url(#sheenD) }
    .orb      { fill: #ffffff; fill-opacity: .16 }
    .orb2     { fill: #ffffff; fill-opacity: .10 }
    .fg       { fill: #f0f6fc }
    .dim      { fill: #8b949e }
    .faint    { fill: #6e7681 }
    .hair     { stroke: #ffffff; stroke-opacity: .09 }
    .chip     { fill: #ffffff; fill-opacity: .05; stroke: #ffffff; stroke-opacity: .10 }
    .dot      { fill: #f0f6fc }
    .node     { fill: #8b949e }
    .cursor   { fill: #f0f6fc }

    @media (prefers-color-scheme: light) {
      .glass  { fill: #0d1117; fill-opacity: .025 }
      .edge   { stroke: #0d1117; stroke-opacity: .10 }
      .sheen  { stroke: url(#sheenL) }
      .orb    { fill: #0d1117; fill-opacity: .10 }
      .orb2   { fill: #0d1117; fill-opacity: .07 }
      .fg     { fill: #0d1117 }
      .dim    { fill: #57606a }
      .faint  { fill: #6e7781 }
      .hair   { stroke: #0d1117; stroke-opacity: .10 }
      .chip   { fill: #0d1117; fill-opacity: .04; stroke: #0d1117; stroke-opacity: .10 }
      .dot    { fill: #0d1117 }
      .node   { fill: #57606a }
      .cursor { fill: #0d1117 }
    }

    @keyframes rise   { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes blink  { 0%, 48% { opacity: 1 } 49%, 100% { opacity: 0 } }
    @keyframes breathe{ 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
    @keyframes driftA { 0%, 100% { transform: translate(0, 0) } 50% { transform: translate(46px, -34px) } }
    @keyframes driftB { 0%, 100% { transform: translate(0, 0) } 50% { transform: translate(-38px, 30px) } }
    @keyframes reveal { from { width: 0 } to { width: 540 } }
    @keyframes draw   { from { stroke-dashoffset: 600 } to { stroke-dashoffset: 0 } }

    .card      { animation: rise .8s cubic-bezier(.2,.8,.2,1) forwards }
    .d1        { animation-delay: 0s }
    .d2        { animation-delay: .12s }
    .d3        { animation-delay: .24s }
    .blink     { animation: blink 1.05s step-end infinite }
    .pulse     { animation: breathe 2.4s ease-in-out infinite }
    .oa        { animation: driftA 16s ease-in-out infinite }
    .ob        { animation: driftB 20s ease-in-out infinite }
    .type      { animation: reveal 1.6s steps(46, end) .4s forwards }
    .stroke-in { stroke-dasharray: 600; animation: draw 2s ease-out .5s forwards }

    @media (prefers-reduced-motion: reduce) {
      .card, .blink, .pulse, .oa, .ob, .type, .stroke-in { animation: none }
    }

    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif }
  </style>

  <defs>
    <linearGradient id="sheenD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheenL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <clipPath id="cHero"><rect x="0"   y="0"   width="660" height="380" rx="26"/></clipPath>
    <clipPath id="cNow"> <rect x="684" y="0"   width="316" height="178" rx="26"/></clipPath>
    <clipPath id="cStk"> <rect x="684" y="202" width="316" height="178" rx="26"/></clipPath>
    <clipPath id="cType"><rect x="44"  y="222" width="540" height="22" class="type"/></clipPath>
  </defs>

  <g class="card d1">
    <g clip-path="url(#cHero)">
      <rect x="0" y="0" width="660" height="380" rx="26" class="glass"/>
      <circle cx="120" cy="70"  r="130" class="orb oa"  filter="url(#soft)"/>
      <circle cx="560" cy="330" r="150" class="orb2 ob" filter="url(#soft)"/>
      <rect x="0" y="0" width="660" height="380" filter="url(#grain)" opacity=".045"/>

      <g class="stroke-in" fill="none" stroke="#8b949e" stroke-opacity=".35" stroke-width="1">
        <path d="M436 92 L520 60 L596 108 L560 178 L468 166 Z"/>
        <path d="M436 92 L560 178"/>
        <path d="M520 60 L468 166"/>
      </g>
      <g class="node">
        <circle cx="436" cy="92"  r="3.5"/>
        <circle cx="520" cy="60"  r="3.5"/>
        <circle cx="596" cy="108" r="3.5"/>
        <circle cx="560" cy="178" r="3.5"/>
        <circle cx="468" cy="166" r="3.5"/>
      </g>

      <text x="44" y="66" class="mono faint" font-size="12" letter-spacing="2.5">~/leticiael</text>

      <text x="42" y="190" class="sans fg" font-size="112" font-weight="700" letter-spacing="-6">let.</text>
      <rect x="216" y="118" width="16" height="74" rx="2" class="cursor blink"/>

      <g clip-path="url(#cType)">
        <text x="44" y="238" class="mono dim" font-size="13.5" letter-spacing=".6">cs student · web development · machine learning</text>
      </g>

      <line x1="44" y1="272" x2="616" y2="272" class="hair" stroke-width="1"/>

      <g>
        <rect x="44" y="300" width="152" height="34" rx="17" class="chip"/>
        <circle cx="66" cy="317" r="4" class="dot pulse"/>
        <text x="80" y="322" class="mono dim" font-size="12" letter-spacing=".4">open to work</text>

        <rect x="206" y="300" width="86" height="34" rx="17" class="chip"/>
        <text x="224" y="322" class="mono dim" font-size="12" letter-spacing=".4">she/her</text>

        <rect x="302" y="300" width="80" height="34" rx="17" class="chip"/>
        <text x="320" y="322" class="mono dim" font-size="12" letter-spacing=".4">brazil</text>
      </g>
    </g>
    <rect x=".5" y=".5" width="659" height="379" rx="26" class="edge" stroke-width="1"/>
    <path d="M26.5 .5 H633.5 A26 26 0 0 1 659.5 26.5" class="sheen" stroke-width="1" fill="none"/>
  </g>

  <g class="card d2">
    <g clip-path="url(#cNow)">
      <rect x="684" y="0" width="316" height="178" rx="26" class="glass"/>
      <circle cx="990" cy="10" r="90" class="orb2 ob" filter="url(#soft)"/>
      <rect x="684" y="0" width="316" height="178" filter="url(#grain)" opacity=".045"/>

      <text x="712" y="44" class="mono faint" font-size="11" letter-spacing="2.5">CURRENTLY</text>

      <text x="712" y="84" class="mono faint" font-size="10.5" letter-spacing="1.6">LEARNING</text>
      <text x="712" y="120" class="sans fg" font-size="30" font-weight="700" letter-spacing="-1.2">machine</text>
      <text x="712" y="152" class="sans fg" font-size="30" font-weight="700" letter-spacing="-1.2">learning</text>
    </g>
    <rect x="684.5" y=".5" width="315" height="177" rx="26" class="edge" stroke-width="1"/>
    <path d="M710.5 .5 H973.5 A26 26 0 0 1 999.5 26.5" class="sheen" stroke-width="1" fill="none"/>
  </g>

  <g class="card d3">
    <g clip-path="url(#cStk)">
      <rect x="684" y="202" width="316" height="178" rx="26" class="glass"/>
      <circle cx="700" cy="380" r="100" class="orb2 oa" filter="url(#soft)"/>
      <rect x="684" y="202" width="316" height="178" filter="url(#grain)" opacity=".045"/>

      <text x="712" y="246" class="mono faint" font-size="11" letter-spacing="2.5">STACK</text>

      <g>
        <rect x="712" y="272" width="80" height="30" rx="10" class="chip"/>
        <text x="752" y="291.5" class="mono dim" font-size="11.5" text-anchor="middle">python</text>

        <rect x="804" y="272" width="80" height="30" rx="10" class="chip"/>
        <text x="844" y="291.5" class="mono dim" font-size="11" text-anchor="middle">typescript</text>

        <rect x="896" y="272" width="80" height="30" rx="10" class="chip"/>
        <text x="936" y="291.5" class="mono dim" font-size="11.5" text-anchor="middle">react</text>

        <rect x="712" y="312" width="80" height="30" rx="10" class="chip"/>
        <text x="752" y="331.5" class="mono dim" font-size="11.5" text-anchor="middle">node</text>

        <rect x="804" y="312" width="80" height="30" rx="10" class="chip"/>
        <text x="844" y="331.5" class="mono dim" font-size="11.5" text-anchor="middle">docker</text>

        <rect x="896" y="312" width="80" height="30" rx="10" class="chip"/>
        <text x="936" y="331.5" class="mono dim" font-size="11.5" text-anchor="middle">git</text>
      </g>
    </g>
    <rect x="684.5" y="202.5" width="315" height="177" rx="26" class="edge" stroke-width="1"/>
    <path d="M710.5 202.5 H973.5 A26 26 0 0 1 999.5 228.5" class="sheen" stroke-width="1" fill="none"/>
  </g>
</svg>
